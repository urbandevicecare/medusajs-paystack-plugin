name: Bump and Publish
on:
  push:
    branches: [main]

jobs:
  build-bump-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org/'

      # 1. Install dependencies
      - run: yarn install

      # 2. Build the plugin (Critical! Otherwise .medusa/server won't be in the npm package)
      - run: yarn build

      # 3. Configure Git for the bump
      - name: Git Config
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"

      # 4. Bump version (patch), commit, and tag
      # Use [skip ci] in the message to prevent an infinite loop
      # We restore any modified files (like yarn.lock) to keep git clean for npm version
      - name: Bump Version
        id: bump_version
        run: |
          git restore .
          npm version patch -m "chore: bump version to %s [skip ci]"
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$PKG_VERSION" >> $GITHUB_OUTPUT
          echo "VERSION=$PKG_VERSION" >> $GITHUB_ENV

      # 5. Push the new version and tag back to GitHub
      - name: Push changes
        run: git push --follow-tags

      # 6. Publish to npm using your secret token
      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # 7. Package tarball asset
      - name: Package tarball asset
        run: npm pack

      # 8. Extract Release Notes from CHANGELOG.md
      - name: Extract Release Notes
        run: |
          node -e "
            const fs = require('fs');
            const version = process.env.VERSION || '';
            const changelog = fs.existsSync('CHANGELOG.md') ? fs.readFileSync('CHANGELOG.md', 'utf8') : '';
            const escapedVersion = version.replace(/\./g, '\\\.');
            const regex = new RegExp('##\\\\s*\\\\[v?' + escapedVersion + '\\\\][\\\\s\\\\S]*?(?=(?:##\\\\s*\\\\[)|$)', 'i');
            const match = changelog.match(regex);
            let notes = match ? match[0].trim().replace(/\s*---\s*$/, '') : '';
            if (!notes) {
              const firstSection = changelog.match(/##\s*\[v?[\d\.]+\][\s\S]*?(?=(?:##\s*\[)|$)/i);
              notes = firstSection ? firstSection[0].trim().replace(/\s*---\s*$/, '') : 'Release v' + version;
            }
            fs.writeFileSync('RELEASE_NOTES.md', notes);
          "

      # 9. Create GitHub Release with assets
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.bump_version.outputs.VERSION }}
          name: v${{ steps.bump_version.outputs.VERSION }}
          body_path: RELEASE_NOTES.md
          generate_release_notes: false
          files: |
            *.tgz
